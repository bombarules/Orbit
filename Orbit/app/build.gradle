plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orbit.hub'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.orbit.hub'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk {
            // The WebRTC library ships every CPU type; phones only need these two.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Real WebRTC for phone screen sharing (the Bomba Live wall protocol).
    implementation 'io.github.webrtc-sdk:android:125.6422.04'
    // WebSocket client for PeerJS signaling.
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
    implementation 'org.slf4j:slf4j-api:1.7.36'
}
