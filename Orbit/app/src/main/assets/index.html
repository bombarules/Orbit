<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Outfit:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#140f16; --ink:#efe3d6; --ink-dim:#b7a59a; --glass:rgba(38,28,36,.6); --edge:rgba(232,196,160,.28); --accent:#e8c4a0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --stage:#140f16; --ink:#efe3d6; } }
:root[data-theme="dark"]{ --stage:#140f16; --ink:#efe3d6; }
html,body{height:100%;margin:0;overflow:hidden;background:var(--stage);color:var(--ink);font-family:"Outfit",system-ui,sans-serif}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.sw{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:56px;height:32px;padding:0;border-radius:16px;
  background:rgba(38,28,36,.65);border:1px solid var(--edge);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sw .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#4a3a44;display:grid;place-items:center;transition:transform .25s,background .25s}
.sw svg{width:15px;height:15px;fill:none;stroke:var(--ink-dim);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sw[aria-pressed="true"]{background:rgba(232,196,160,.22);border-color:var(--accent)}
.sw[aria-pressed="true"] .knob{transform:translateX(24px);background:var(--accent)}
.sw[aria-pressed="true"] svg{stroke:#2a1f27}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.label{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translate(-50%,8px);text-align:center;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;width:80%}
.label.on{opacity:1;transform:translate(-50%,0)}
.label b{display:block;font-family:"Fraunces",serif;font-weight:400;font-size:22px;color:#f1d9bf}
.label a{display:none;margin:8px auto 0;width:max-content;padding:9px 22px;border-radius:999px;background:rgba(232,196,160,.18);border:1px solid var(--accent);color:var(--ink);font-size:15px;text-decoration:none;pointer-events:auto}
.label a.on{display:block}
.label a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.label span{font-size:13px;color:var(--ink-dim);font-weight:300}
 .rbtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:36px;height:36px;padding:0;border-radius:50%;background:rgba(38,28,36,.65);border:1px solid var(--edge);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.rbtn svg{width:18px;height:18px;fill:none;stroke:var(--ink-dim);stroke-width:1.8;stroke-linecap:round}
.rbtn:focus-visible,.recents button:focus-visible,.recents a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.recents{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);max-height:60%;overflow:auto;padding:14px 16px;border-radius:20px;background:rgba(30,22,28,.92);border:1px solid var(--edge);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rhead b{font-family:"Fraunces",serif;font-weight:400;font-size:19px;color:#f1d9bf}
.rhead button{background:none;border:0;color:var(--ink-dim);font-size:16px;padding:6px 8px;cursor:pointer}
.rbtns{display:flex;align-items:center;gap:6px}
#rtrash svg{width:19px;height:19px;fill:none;stroke:var(--ink-dim);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
#rtrash[hidden]{display:none}
html,body{background:#140f16}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid rgba(232,196,160,.12);color:var(--ink);text-decoration:none}
.rrow img{width:34px;height:34px;flex:0 0 auto}
.rrow .tx{flex:1;min-width:0}.rrow .t{display:block;font-size:15px}.rrow .d{font-size:12px;color:var(--ink-dim);font-weight:300}
.rrow .go{font-size:13px;color:var(--accent)}
.rnone{color:var(--ink-dim);font-size:14px;font-weight:300;padding:10px 4px}
.handle{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 4px);width:44px;height:5px;padding:0;border:0;border-radius:3px;background:rgba(232,196,160,.35);cursor:pointer}
.drawer,.drawer *{box-sizing:border-box}
.drawer{position:fixed;inset:0;z-index:20;background:rgba(20,15,22,.97);padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;animation:dup .25s ease-out}
.drawer[hidden]{display:none}
@keyframes dup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.dtop{display:flex;gap:10px;align-items:center;width:100%}
.dtop input{flex:1 1 auto;min-width:0;width:100%;font:300 16px "Outfit",sans-serif;color:var(--ink);background:rgba(232,196,160,.08);border:1px solid var(--edge);border-radius:999px;padding:11px 16px;outline:none}
.dtop input:focus{border-color:var(--accent)}
.dtop button{flex:0 0 auto;width:44px;height:44px;padding:0;display:grid;place-items:center;font-size:17px;color:var(--ink-dim);background:none;border:1px solid var(--edge);border-radius:50%;cursor:pointer}
.dtoggle{display:flex;align-items:center;justify-content:space-between;width:100%;margin:12px 0 0;min-height:44px;padding:0 14px;font:400 14px "Outfit",sans-serif;color:var(--ink-dim);background:none;border:1px solid var(--edge);border-radius:14px;cursor:pointer}
.dtoggle svg{width:20px;height:20px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.dtoggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.dtoggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dacts[hidden]{display:none!important}
.dacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.dacts button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 10px;font:400 14px "Outfit",sans-serif;color:var(--ink);background:rgba(232,196,160,.07);border:1px solid var(--edge);border-radius:14px;cursor:pointer}
.dacts button:active{background:rgba(232,196,160,.16)}
.dacts svg{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dacts span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dacts .wide{grid-column:1/-1}
.dgrid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 4px;margin-top:10px;padding:10px 0 30px;align-content:start;border-top:1px solid rgba(232,196,160,.12)}
.dapp{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--ink);font:300 12px "Outfit",sans-serif;cursor:pointer;padding:4px}
.dapp img{width:52px;height:52px}
.dapp img{width:min(52px,15vw);height:min(52px,15vw)}
.dapp span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dnone{grid-column:1/-1;text-align:center;color:var(--ink-dim);font-weight:300}
.drawer button:focus-visible,.dtop input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.liveov{position:fixed;inset:0;z-index:30;background:#0b080c;display:flex;flex-direction:column}
.liveov[hidden]{display:none}
.liveov.zoom{animation:lvzoom .28s cubic-bezier(.2,.8,.2,1)}
@keyframes lvzoom{from{transform:scale(.35);opacity:0;border-radius:40px}to{transform:none;opacity:1}}
.liveov video{flex:1;min-height:0;width:100%;object-fit:contain;background:#0b080c}
.lvbar{display:flex;align-items:center;gap:12px;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
.lvbar b{flex:1;font:400 18px "Fraunces",serif;color:#f1d9bf}
.lvbar button{width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:none;color:var(--ink);font-size:17px;cursor:pointer}
.dlive{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;border:1px solid var(--edge);border-radius:14px;background:rgba(232,196,160,.04)}
.dlive .lvt{grid-column:1/-1;display:flex;align-items:center;gap:8px;font:400 15px "Fraunces",serif;color:#f1d9bf}
.dlive .lvt svg{width:20px;height:20px;fill:none;stroke:var(--accent);stroke-width:1.7}
.dlive select,.dlive button{min-height:44px;font:400 14px "Outfit",sans-serif;color:var(--ink);background:#120d14;border:1px solid var(--edge);border-radius:12px;padding:0 10px;width:100%;min-width:0}
.dlive #lvCode{grid-column:1/-1;letter-spacing:.06em}
.dlive #lvOpen{grid-column:1/-1}
.liveov .lvkeys{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#1e161c;border-top:1px solid var(--edge);padding:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.liveov .lvkeys[hidden]{display:none}
.liveov .lvkeys input{flex:1;min-width:130px;background:#140f16;border:1px solid var(--edge);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit}
.liveov .lvkeys button{border:1px solid var(--edge);background:none;color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit}
.liveov .lvkeys .st{color:#b7a59a;font-size:12px;flex-basis:100%}
.liveov.ctlmode #lvCtl{background:#9cc5a4;color:#12241a;border-color:#9cc5a4}
.dlive #lvShare.on{background:#c46b6b;border-color:#c46b6b;color:#fff}
.dlive #lvStat{grid-column:1/-1;margin:0;font-size:12px;color:var(--ink-dim);min-height:1em}
.dlive select:focus-visible,.dlive button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.askbox,.askbox *{box-sizing:border-box}
.askbox{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(10,7,11,.6);padding:20px}
.askbox[hidden]{display:none}
.askcard{display:flex;align-items:center;gap:10px;width:min(340px,100%);padding:14px;border-radius:20px;background:#1e161c;border:1px solid var(--edge);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.askcard input{flex:1;min-width:0;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--edge);background:#120d14;color:var(--ink);font:400 17px "Outfit",sans-serif;outline:none}
.askcard input.code{text-align:center;letter-spacing:.14em;text-transform:uppercase;font-size:19px}
.askcard input:focus{border-color:var(--accent)}
.askcard button{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:none;color:var(--ink-dim);font-size:17px;cursor:pointer}
.askcard #askOk{background:var(--accent);border-color:var(--accent);color:#2a1f27}
.askcard button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.liveov video{position:absolute;inset:0;width:100%;height:100%}
.liveov .lvbar{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(10,7,11,.85));opacity:0;transition:opacity .3s;pointer-events:none}
.liveov.bar .lvbar{opacity:1;pointer-events:auto}
.liveov{padding:0}
@media (prefers-reduced-motion: reduce){.drawer{animation:none}.label,.sw .knob{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="App icons floating in a sphere in space. Tap one to open it."></canvas>
<button class="handle" id="dHandle" aria-label="All phone apps"></button>
<div class="drawer" id="drawer" hidden role="dialog" aria-label="Phone apps">
 <div class="dtop"><input id="dSearch" type="search" placeholder="Search apps" autocomplete="off"><button id="dClose" aria-label="Close">✕</button></div>
 <button class="dtoggle" id="dToggle" aria-expanded="false" aria-controls="dActs"><span>Settings &amp; live screens</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
 <div class="dacts" id="dActs" hidden>
  <button id="dWall"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 15l3-3 2 2 3-3"/><circle cx="9" cy="8" r="1.3"/></svg><span>Wallpaper</span></button>
  <button id="dHome"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg><span>Home screen</span></button>
  <div class="dlive" role="group" aria-label="Live screens">
   <div class="lvt"><svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="8.5" height="6.5" rx="1.5"/><rect x="13" y="4" width="8.5" height="6.5" rx="1.5"/><rect x="2.5" y="13" width="8.5" height="6.5" rx="1.5"/><rect x="13" y="13" width="8.5" height="6.5" rx="1.5"/></svg>Live screens on the ball</div>
   <button id="lvCode"></button>
   <select id="lvMe" aria-label="This device"></select>
   <button id="lvShare">Share this phone</button>
   <button id="lvOpen">Open Bomba Live</button>
   <p id="lvStat" role="status"></p>
  </div>
 </div>
 <div class="dgrid" id="dGrid"><div class="dnone">Loading apps…</div></div>
</div>
<button class="rbtn" id="rbtn" aria-label="Recently opened apps"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
<div class="recents" id="recents" hidden><div class="rhead"><b>Recently opened</b><span class="rbtns"><button id="rtrash" aria-label="Delete recents"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 12.5h9l1-12.5M10 11v5.5M14 11v5.5"/></svg></button><button id="rclose" aria-label="Close recents">✕</button></span></div><div id="rlist"></div></div>
<div class="askbox" id="askBox" hidden role="dialog" aria-modal="true" aria-label="Enter"><div class="askcard"><button id="askNo" aria-label="Cancel">✕</button><input id="askIn" autocomplete="off" spellcheck="false"><button id="askOk" aria-label="OK">✓</button></div></div><div class="liveov" id="liveOv" hidden role="dialog" aria-label="Live screen"><video id="liveVid" playsinline muted autoplay></video><div class="lvbar"><b id="liveName"></b><button id="lvCtl" aria-label="Control this screen">🖱</button><button id="lvKeys" aria-label="Keyboard" hidden>⌨</button><button id="liveClose" aria-label="Close">✕</button></div><div class="lvkeys" id="lvKeyBar" hidden><input id="lvText" placeholder="Type, then Enter to send" autocomplete="off" autocapitalize="off"><button data-k="enter">Enter</button><button data-k="esc">Esc</button><button data-k="tab">Tab</button><button data-k="backspace">⌫</button><button data-k="up">↑</button><button data-k="down">↓</button><button data-k="left">←</button><button data-k="right">→</button><span class="st" id="lvCtlStat"></span></div></div>
<div class="label" id="label" role="status"><b id="lb-t"></b><a id="lb-a" target="_top">Open</a><span id="lb-d"></span></div>

<script src="three.min.js"></script>
<script src="peerjs.min.js"></script>
<script>
(function(){
const APPS=[
 {n:"AquaticsTechApp",i:"wave",c:"#9cc5bf",url:"apps/aquatics-tech.html"},
 {n:"WinterizingPoolEquipment",i:"flake",c:"#b6c4d6",url:""},
 {n:"PropertyResource",i:"house",c:"#d9bb92",url:"apps/parks-map.html"},
 {n:"FieldReportApp",i:"clip",c:"#abc4a4",url:"apps/field-reports.html"},
 {n:"EmployeeCommunityBook",i:"book",c:"#e2aba3",url:""},
 {n:"OddsApp",i:"dice",c:"#e5c48a",url:""},
 {n:"SnowKnows",i:"cloud",c:"#d6cbe2",url:""},
 {n:"Wheelscache",i:"wheel",c:"#e6b9a4",url:""}
];
const split=s=>s.replace(/([a-z])([A-Z])/g,"$1 $2");

const ICON={
 wave(c){for(let k=-1;k<=1;k++){c.beginPath();for(let x=-120;x<=120;x+=4){const y=k*62+Math.sin(x/30)*20;x===-120?c.moveTo(x,y):c.lineTo(x,y);}c.stroke();}},
 flake(c){for(let k=0;k<6;k++){c.save();c.rotate(k*Math.PI/3);c.beginPath();c.moveTo(0,0);c.lineTo(0,-125);c.moveTo(0,-70);c.lineTo(-30,-100);c.moveTo(0,-70);c.lineTo(30,-100);c.stroke();c.restore();}},
 house(c){c.beginPath();c.moveTo(-125,-5);c.lineTo(0,-115);c.lineTo(125,-5);c.moveTo(-90,-35);c.lineTo(-90,115);c.lineTo(90,115);c.lineTo(90,-35);c.stroke();c.beginPath();c.moveTo(-28,115);c.lineTo(-28,40);c.lineTo(28,40);c.lineTo(28,115);c.stroke();},
 clip(c){c.beginPath();c.roundRect?c.roundRect(-90,-110,180,235,22):c.rect(-90,-110,180,235);c.stroke();c.beginPath();c.moveTo(-40,-110);c.lineTo(-40,-135);c.lineTo(40,-135);c.lineTo(40,-110);c.stroke();
   c.beginPath();c.moveTo(-50,10);c.lineTo(-12,48);c.lineTo(55,-30);c.stroke();},
 book(c){c.beginPath();c.moveTo(0,-80);c.quadraticCurveTo(-60,-115,-130,-90);c.lineTo(-130,95);c.quadraticCurveTo(-60,70,0,105);c.quadraticCurveTo(60,70,130,95);c.lineTo(130,-90);c.quadraticCurveTo(60,-115,0,-80);c.lineTo(0,105);c.stroke();},
 dice(c){c.beginPath();c.roundRect?c.roundRect(-115,-115,230,230,40):c.rect(-115,-115,230,230);c.stroke();[[-55,-55],[55,55],[0,0],[55,-55],[-55,55]].forEach(([x,y])=>{c.beginPath();c.arc(x,y,18,0,7);c.fill();});},
 wheel(c){c.beginPath();c.arc(0,0,120,0,7);c.stroke();c.beginPath();c.arc(0,0,32,0,7);c.stroke();for(let k=0;k<6;k++){const a=k*Math.PI/3;c.beginPath();c.moveTo(Math.cos(a)*32,Math.sin(a)*32);c.lineTo(Math.cos(a)*120,Math.sin(a)*120);c.stroke();}},
 cloud(c){c.beginPath();c.moveTo(-95,10);c.arc(-70,-25,40,Math.PI*.6,Math.PI*1.5);c.arc(5,-55,62,Math.PI*1.1,Math.PI*1.95);c.arc(78,-15,42,Math.PI*1.4,Math.PI*.45);c.closePath();c.stroke();
   [[-60,70],[0,95],[60,70],[-30,130],[30,130]].forEach(([x,y])=>{c.beginPath();c.arc(x,y,12,0,7);c.fill();});}
};
function drawTile(ctx,a,sel){
  const S=512;ctx.clearRect(0,0,S,S);
  const g=ctx.createLinearGradient(0,0,S,S);g.addColorStop(0,"#2c2129");g.addColorStop(1,"#1e171d");
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect?ctx.roundRect(16,16,S-32,S-32,48):ctx.rect(16,16,S-32,S-32);ctx.fill();
  ctx.save();ctx.shadowColor=a.c;ctx.shadowBlur=sel?40:22;ctx.strokeStyle=a.c;ctx.lineWidth=sel?12:7;
  ctx.beginPath();ctx.roundRect?ctx.roundRect(30,30,S-60,S-60,38):ctx.rect(30,30,S-60,S-60);ctx.stroke();ctx.restore();
  ctx.save();ctx.translate(S/2,S/2);ctx.strokeStyle=a.c;ctx.fillStyle=a.c;ctx.lineWidth=20;ctx.lineCap="round";ctx.lineJoin="round";
  ICON[a.i](ctx);ctx.restore();
}

const cv=document.getElementById("c");
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(45,1,.1,300);

/* warm space backdrop */
S.add(new THREE.Mesh(new THREE.SphereGeometry(120,32,32),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
vertexShader:`varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:`varying vec3 vP;
float h2(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){vec3 d=normalize(vP);
 vec3 col=mix(vec3(.055,.043,.066),vec3(.085,.062,.090),smoothstep(-1.,1.,d.y)*.8);
 col+=vec3(.10,.055,.075)*pow(max(dot(d,normalize(vec3(-.6,.35,-.7))),0.),6.)*.55;
 col+=vec3(.06,.055,.11)*pow(max(dot(d,normalize(vec3(.7,-.3,-.6))),0.),6.)*.5;
 col+=(h2(gl_FragCoord.xy)-.5)/255.;
 gl_FragColor=vec4(col,1.);}`})));
const sp=new Float32Array(2400);for(let i=0;i<800;i++){const v=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize().multiplyScalar(60+Math.random()*50);sp.set([v.x,v.y,v.z],i*3);}
const SG=new THREE.BufferGeometry();SG.setAttribute("position",new THREE.BufferAttribute(sp,3));
S.add(new THREE.Points(SG,new THREE.PointsMaterial({size:.22,color:0xf0dcc4,transparent:true,opacity:.5})));

/* truncated icosahedron (soccer ball): 32 panels, each app fills its whole panel */
const PHI=(1+Math.sqrt(5))/2,raw=[];
const cyc=(a,b,c)=>{raw.push([a,b,c],[c,a,b],[b,c,a]);};
for(const sa of[1,-1])for(const sb of[1,-1]){cyc(0,sa,sb*3*PHI);}

  dirs.forEach(([d,n])=>{d.normalize();const fv=V.map(v=>({v,t:v.dot(d)})).sort((p,q)=>q.t-p.t).slice(0,n).map(p=>p.v);

  const g=new THREE.ShapeGeometry(sh);g.computeBoundingBox();const b=g.boundingBox,w=b.max.x-b.min.x,h=b.max.y-b.min.y,s=Math.max(w,h);
  const p=g.attributes.position,uv=g.attributes.uv;
  for(let i=0;i<p.count;i++){let u,v;
    if(mode==="fill"){u=(p.getX(i)-b.min.x)/w;v=(p.getY(i)-b.min.y)/h}else{u=p.getX(i)/s+.5;v=p.getY(i)/s+.5}
    uv.setXY(i,mirror?1-u:u,v)}uv.needsUpdate=true;return g}

  document.getElementById("liveName").textContent=name;window.__lvName=name;if(window.__lvStopCtl)window.__lvStopCtl();const ov=document.getElementById("liveOv");ov.hidden=false;
  ov.classList.remove("zoom");void ov.offsetWidth;ov.classList.add("zoom");liveOpenedAt=Date.now();}
function closeLive(){document.getElementById("liveOv").hidden=true;document.getElementById("liveVid").srcObject=null;document.getElementById("liveName").textContent="";}
document.getElementById("liveClose").onclick=closeLive;
document.getElementById("liveOv").addEventListener("click",e=>{if(Date.now()-liveOpenedAt<500)return;
  if(e.target.id==="liveVid"){if(window.__lvCtl)return;lvMode=lvMode==="fill"?"fit":"fill";lvFit();lvShowBar();}});
window.closeLive=closeLive;

/* live view control: pinch or scroll to zoom into the shared screen, drag to move around, double-tap resets */
(function(){const v=document.getElementById("liveVid"),ov=document.getElementById("liveOv");
  v.style.touchAction="none";
  let sc=1,tx=0,ty=0,moved=false,pinchD=0;const pts=new Map();
  function apply(){v.style.transform=(sc===1&&tx===0&&ty===0)?"":"translate("+tx+"px,"+ty+"px) scale("+sc+")";}
  function reset(){sc=1;tx=0;ty=0;apply();}
  function clamp(){const mx=Math.max(0,(sc-1)*v.clientWidth/2),my=Math.max(0,(sc-1)*v.clientHeight/2);
    tx=Math.min(mx,Math.max(-mx,tx));ty=Math.min(my,Math.max(-my,ty));}
  v.addEventListener("pointerdown",e=>{if(window.__lvCtl)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
    if(pts.size===2){const p=[...pts.values()];pinchD=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}});
  v.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);
    const dx=e.clientX-prev.x,dy=e.clientY-prev.y;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
    if(pts.size===2){const p=[...pts.values()];const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
      if(pinchD>0){sc=Math.min(4,Math.max(1,sc*d/pinchD));clamp();apply();}pinchD=d;}
    else if(pts.size===1&&sc>1){tx+=dx;ty+=dy;clamp();apply();}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinchD=0;};
  v.addEventListener("pointerup",up);v.addEventListener("pointercancel",up);
  v.addEventListener("dblclick",reset);
  v.addEventListener("wheel",e=>{if(window.__lvCtl)return;e.preventDefault();sc=Math.min(4,Math.max(1,sc*(e.deltaY<0?1.15:0.87)));if(sc===1){tx=0;ty=0;}clamp();apply();},{passive:false});
  v.addEventListener("loadedmetadata",reset);
  ov.addEventListener("click",e=>{if(moved){e.stopPropagation();moved=false;}},true);
  const oc=window.closeLive,nc=function(){reset();oc();};
  window.closeLive=nc;document.getElementById("liveClose").onclick=nc;})();

/* remote control from the live view: the mouse button takes over the screen
   you are watching — tap clicks, drag drags, two-finger tap right-clicks,
   two-finger slide scrolls, keyboard button types to it. */
(function(){const v=document.getElementById("liveVid"),ov=document.getElementById("liveOv"),
  ctlBtn=document.getElementById("lvCtl"),keysBtn=document.getElementById("lvKeys"),
  bar=document.getElementById("lvKeyBar"),inp=document.getElementById("lvText"),
  stat=document.getElementById("lvCtlStat");
  let conn=null,on=false;
  const send=d=>{if(conn&&conn.open)try{conn.send(d)}catch(e){}};
  const note=s=>{stat.textContent=s;};
  function mapPt(px,py){if(!v.videoWidth)return null;const r=v.getBoundingClientRect();
    const s=getComputedStyle(v).objectFit==="cover"?Math.max(r.width/v.videoWidth,r.height/v.videoHeight):Math.min(r.width/v.videoWidth,r.height/v.videoHeight);
    const dw=v.videoWidth*s,dh=v.videoHeight*s,ox=r.left+(r.width-dw)/2,oy=r.top+(r.height-dh)/2;
    const x=(px-ox)/dw,y=(py-oy)/dh;return(x<0||x>1||y<0||y>1)?null:{x:x,y:y}}
  const pts=new Map();let start=null,dragging=false,lastMove=0,two=null,wheelAcc=0;
  v.addEventListener("pointerdown",e=>{if(!on)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){start={x:e.clientX,y:e.clientY,t:Date.now()};dragging=false}
    else if(pts.size===2){const p=[...pts.values()];two={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2,t:Date.now(),moved:0}}});
  v.addEventListener("pointermove",e=>{if(!on||!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&two){const p=[...pts.values()];const cy=(p[0].y+p[1].y)/2;const dy=cy-two.y;two.y=cy;two.moved+=Math.abs(dy);
      wheelAcc+=dy;if(Math.abs(wheelAcc)>=36){send({t:"wheel",d:wheelAcc<0?1:-1});wheelAcc=0}}
    else if(pts.size===1&&start){const dx=e.clientX-start.x,dy=e.clientY-start.y;
      if(!dragging&&Math.hypot(dx,dy)>9){dragging=true;const p0=mapPt(start.x,start.y);if(p0)send({t:"down",b:0,x:p0.x,y:p0.y})}
      if(dragging&&Date.now()-lastMove>40){lastMove=Date.now();const p=mapPt(e.clientX,e.clientY);if(p)send({t:"move",x:p.x,y:p.y})}}});
  const up=e=>{if(!on){pts.delete(e.pointerId);return}
    if(pts.size===2&&two){if(Date.now()-two.t<300&&two.moved<12){const p=mapPt(two.x,two.y);if(p)send({t:"click",b:2,x:p.x,y:p.y})}two=null}
    else if(pts.size===1&&start){const p=mapPt(e.clientX,e.clientY);
      if(dragging){if(p)send({t:"move",x:p.x,y:p.y});send({t:"up",b:0})}
      else if(Date.now()-start.t<500&&p)send({t:"click",b:0,x:p.x,y:p.y});
      start=null;dragging=false}
    pts.delete(e.pointerId)};
  v.addEventListener("pointerup",up);v.addEventListener("pointercancel",up);
  v.addEventListener("wheel",e=>{if(!on)return;e.preventDefault();send({t:"wheel",d:e.deltaY>0?1:-1})},{passive:false});
  function stop(){if(conn)try{conn.close()}catch(e){}conn=null;on=false;window.__lvCtl=false;
    ov.classList.remove("ctlmode");keysBtn.hidden=true;bar.hidden=true}
  ctlBtn.onclick=()=>{if(on){stop();return}
    const name=window.__lvName;if(!name||!livePeer||!livePeer.open)return;
    conn=livePeer.connect(pidL(name),{reliable:true,serialization:"json"});
    conn.on("open",()=>{on=true;window.__lvCtl=true;ov.classList.add("ctlmode");keysBtn.hidden=false;
      v.dispatchEvent(new Event("loadedmetadata"));note("Controlling "+name);lvShowBar();});
    conn.on("data",d=>{if(d&&d.note){note(d.note);bar.hidden=false}});
    conn.on("close",()=>{if(on)stop()});};
  keysBtn.onclick=()=>{bar.hidden=!bar.hidden;if(!bar.hidden)inp.focus();lvShowBar();};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();
    if(inp.value){send({t:"text",s:inp.value});inp.value=""}}});
  document.querySelectorAll("#lvKeyBar [data-k]").forEach(b=>b.onclick=()=>send({t:"key",k:b.getAttribute("data-k")}));
  window.__lvStopCtl=stop;
  const pc=window.closeLive,cl=function(){stop();pc();};
  window.closeLive=cl;document.getElementById("liveClose").onclick=cl;})();

/* wall code, device name and phone sharing — all from the drawer, no extra page */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let liveCode=LS.get("bomba-live-code",null),liveDevs=LS.get("bomba-live-devices",["Home computer","Work computer","Phone","Tablet","Mac"]);
const slugL=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const pidL=n=>"bomba-"+liveCode.toLowerCase().replace(/[^a-z0-9]/g,"")+"-"+slugL(n);
function liveUI(){const cb=document.getElementById("lvCode");if(!cb)return;cb.textContent=liveCode?"Code "+liveCode:"Enter wall code";
  const s=document.getElementById("lvMe"),me=LS.get("bomba-live-me","Phone");s.innerHTML="";
  liveDevs.forEach(n=>{const o=document.createElement("option");o.textContent=n;if(n===me)o.selected=true;s.appendChild(o)});
  const add=document.createElement("option");add.value="__add";add.textContent="Add a device…";s.appendChild(add);}
function askField(opts){return new Promise(res=>{const box=document.getElementById("askBox"),inp=document.getElementById("askIn");
  inp.value=opts.value||"";inp.placeholder=opts.placeholder||"";inp.maxLength=opts.max||30;inp.setAttribute("aria-label",opts.label);
  inp.classList.toggle("code",!!opts.code);box.hidden=false;setTimeout(()=>{inp.focus();inp.select()},50);
  const done=v=>{box.hidden=true;document.getElementById("askOk").onclick=document.getElementById("askNo").onclick=inp.onkeydown=null;res(v)};
  document.getElementById("askOk").onclick=()=>done(inp.value);document.getElementById("askNo").onclick=()=>done(null);
  inp.onkeydown=e=>{if(e.key==="Enter")done(inp.value);if(e.key==="Escape")done(null)};
  if(opts.code)inp.oninput=()=>{const c=inp.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);inp.value=c.length>4?c.slice(0,4)+"-"+c.slice(4):c};else inp.oninput=null;})}
function liveSetCode(){askField({value:liveCode||"",placeholder:"XXXX-XXXX",label:"Wall code",max:9,code:true}).then(r=>{
  const v=(r||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(v.length!==8)return;
  liveCode=v.slice(0,4)+"-"+v.slice(4);LS.set("bomba-live-code",liveCode);location.reload();});}
window.bombaShareStatus=function(s){const b=document.getElementById("lvShare"),t=document.getElementById("lvStat");if(!b)return;
  const on=s.state==="live"||s.state==="starting";b.textContent=on?"Stop sharing":"Share this phone";b.classList.toggle("on",on);
  t.textContent=s.state==="live"?"Sharing as "+s.name+(s.viewers?" · "+s.viewers+" watching":s.offers?" · connecting ("+(s.answers||0)+"/"+s.offers+")":" · waiting for a screen to connect")+(s.problem?" · "+s.problem:"")
    :s.state==="starting"?"Starting…":s.state==="error"?(s.message||"Couldn’t share"):"";};
(function liveWire(){const cb=document.getElementById("lvCode");if(!cb)return;liveUI();
  cb.onclick=liveSetCode;
  document.getElementById("lvOpen").onclick=()=>{location.href="apps/live.html";};
  document.getElementById("lvMe").onchange=e=>{let v=e.target.value;
    if(v==="__add"){askField({placeholder:"Device name",label:"Device name"}).then(r=>{const n=(r||"").trim();
      if(n&&!liveDevs.some(d=>slugL(d)===slugL(n))){liveDevs.push(n);LS.set("bomba-live-devices",liveDevs)}
      if(n)LS.set("bomba-live-me",n);liveUI();});return}
    LS.set("bomba-live-me",v);liveUI();};
  document.getElementById("lvShare").onclick=()=>{if(!window.BombaNative||!BombaNative.startScreenShare)return;
    if(document.getElementById("lvShare").classList.contains("on")){BombaNative.stopScreenShare();return}
    if(!liveCode){liveSetCode();return}
    BombaNative.startScreenShare(liveCode,LS.get("bomba-live-me","Phone"));bombaShareStatus({state:"starting"});};
  try{const s=JSON.parse(BombaNative.shareState()||"{}");if(s.state)bombaShareStatus(s)}catch(e){}})();

(function startLive(){
  if(!window.Peer||!liveCode)return;
  const c=document.createElement("canvas");c.width=c.height=2;c.getContext("2d").fillRect(0,0,2,2);liveDummy=c.captureStream(1);
  livePeer=new Peer(undefined,{config:{iceServers:[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}]}});
  const dial=n=>{if(!livePeer.open||liveCalls[n]||liveFaces[n])return;
    if(n===LS.get("bomba-live-me","Phone"))return;
    const call=livePeer.call(pidL(n),liveDummy);if(!call)return;liveCalls[n]=call;
    call.on("stream",st=>{if(!liveFaces[n])liveFace(n,st);st.getVideoTracks().forEach(t=>t.onended=()=>liveDrop(n))});
    call.on("close",()=>liveDrop(n));call.on("error",()=>liveDrop(n));
    setTimeout(()=>{if(liveCalls[n]===call&&!liveFaces[n]){try{call.close()}catch(e){}liveCalls[n]=null}},10000);
    const chk=setInterval(()=>{const pc=call.peerConnection;if(liveCalls[n]!==call&&!liveFaces[n]){clearInterval(chk);return}
      if(pc&&["failed","closed"].includes(pc.iceConnectionState)){clearInterval(chk);try{call.close()}catch(e){}liveDrop(n)}},4000);};
  livePeer.on("open",()=>liveDevs.forEach(dial));
  livePeer.on("error",e=>{const m=/peer (\S+)/.exec(e.message||"");if(m){const n=liveDevs.find(d=>pidL(d)===m[1]);if(n)liveCalls[n]=null}});
  livePeer.on("disconnected",()=>{try{livePeer.reconnect()}catch(e){}});
  setInterval(()=>{if(!document.hidden)liveDevs.forEach(dial)},7000);
})();

/* view control */
let yaw=0,pitch=.45,vy=0,vp=0,gx=0,gy=0,dist=7,spin=true,drag=null,moved=0,sel=-1;
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
  dist=Math.max(4.9,4.15/(2*Math.tan(THREE.MathUtils.degToRad(22.5))*Math.min(cam.aspect,1.2)));}
addEventListener("resize",size);size();
let fsTried=false;
function goFull(){if(fsTried)return;fsTried=true;const d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;try{const p=f&&f.call(d,{navigationUI:"hide"});if(p&&p.catch)p.catch(()=>{});}catch(_){}}
let sY=0;cv.addEventListener("pointerdown",e=>{goFull();sY=e.clientY;drag={x:e.clientX,y:e.clientY};moved=0;cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);
  vy=-dx*.006;vp=dy*.004;yaw+=vy;pitch=THREE.MathUtils.clamp(pitch+vp,-.9,1.1);drag={x:e.clientX,y:e.clientY};hideHint();});
cv.addEventListener("pointerup",e=>{if(sY>innerHeight*.65&&sY-e.clientY>80){drag=null;openDrawer();return;}if(moved<8)pick(e.clientX,e.clientY);drag=null;});
const rc=new THREE.Raycaster(),m2=new THREE.Vector2();
function pick(x,y){document.getElementById("recents").hidden=true;m2.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);rc.setFromCamera(m2,cam);
  const hit=rc.intersectObjects(pickables)[0];if(hit&&hit.object.userData.live){select(-1);openLive(hit.object.userData.live);return;}select(hit?hit.object.userData.i:-1);hideHint();}

const label=document.getElementById("label");let openT,focus=null;
function select(i){sel=i;clearTimeout(openT);
  APPS.forEach((a,k)=>{const on=i<0||k===i;a.mats.forEach(m=>m.opacity=on?1:.35);});
  if(i<0){label.classList.remove("on");document.getElementById("lb-a").classList.remove("on");focus=null;return;}
  const a=APPS[i],d=a.dir;const phi=Math.atan2(d.x,d.z);
  let tgt=(yaw+sy)-phi;tgt=rig.rotation.y+Math.atan2(Math.sin(tgt-rig.rotation.y),Math.cos(tgt-rig.rotation.y));focus=tgt;
  document.getElementById("lb-t").textContent=split(a.n);
  const lk=document.getElementById("lb-a");
  document.getElementById("lb-d").textContent=a.url?"":"App not published yet";
  if(a.url){lk.href=a.url;lk.classList.add("on");}else{lk.removeAttribute("href");lk.classList.remove("on");}
  label.classList.add("on");
}

function hideHint(){}

/* recents: same idea as the All Together hub — real links that open the app in place (target="_top") */
const RKEY="bomba-recents";
const rload=()=>{try{return JSON.parse(localStorage.getItem(RKEY))||[]}catch(_){return[]}};
const rsave=v=>{try{localStorage.setItem(RKEY,JSON.stringify(v))}catch(_){}};
function remember(i){const k=APPS[i].n;rsave([{k,at:Date.now()},...rload().filter(x=>x.k!==k)].slice(0,8));}
document.getElementById("lb-a").addEventListener("click",()=>{if(sel>=0)remember(sel);});
const ago=t=>{const m=Math.round((Date.now()-t)/60000);if(m<1)return"just now";if(m<60)return m+" min ago";const h=Math.round(m/60);if(h<24)return h+" hr ago";return new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"})};
const recents=document.getElementById("recents"),rlist=document.getElementById("rlist");
function drawRecents(){const list=rload().map(x=>({x,a:APPS.find(p=>p.n===x.k)})).filter(r=>r.a&&r.a.url);rlist.innerHTML="";
  document.getElementById("rtrash").hidden=!list.length;
  if(!list.length){rlist.innerHTML='<div class="rnone">Apps you open will show here.</div>';return;}
  list.forEach(({x,a})=>{const r=document.createElement("a");r.className="rrow";r.href=a.url;r.target="_top";
    r.innerHTML=`<img alt="" src="${a.icon.toDataURL()}"><span class="tx"><span class="t"></span><span class="d"></span></span><span class="go">Open</span>`;
    r.querySelector(".t").textContent=split(a.n);r.querySelector(".d").textContent="Opened "+ago(x.at);
    r.addEventListener("click",()=>remember(APPS.indexOf(a)));rlist.appendChild(r);});}
document.getElementById("rbtn").onclick=()=>{if(recents.hidden){select(-1);drawRecents();recents.hidden=false;document.getElementById("rclose").focus();}else recents.hidden=true;};
document.getElementById("rtrash").onclick=()=>{rsave([]);drawRecents();document.getElementById("rclose").focus();};
document.getElementById("rclose").onclick=()=>{recents.hidden=true;document.getElementById("rbtn").focus();};

/* phone app drawer (APK home screen) */
const drawer=document.getElementById("drawer"),dGrid=document.getElementById("dGrid"),dSearch=document.getElementById("dSearch");
let phoneApps=null;
window.bombaApps=function(list){phoneApps=list;drawApps();};
function drawApps(){if(!phoneApps)return;const q=dSearch.value.trim().toLowerCase();dGrid.innerHTML="";
  const list=phoneApps.filter(a=>!q||a.label.toLowerCase().includes(q));
  if(!list.length){dGrid.innerHTML='<div class="dnone">No apps found</div>';return;}
  list.forEach(a=>{const b=document.createElement("button");b.className="dapp";b.innerHTML='<img alt=""><span></span>';
    b.querySelector("img").src=a.icon;b.querySelector("span").textContent=a.label;b.setAttribute("aria-label",a.label);
    b.onclick=()=>{closeDrawer();BombaNative.launch(a.pkg);};dGrid.appendChild(b);});}
function openDrawer(){if(!window.BombaNative)return;select(-1);document.getElementById("recents").hidden=true;drawer.hidden=false;
  dSearch.value="";if(phoneApps)drawApps();BombaNative.requestApps();}
function closeDrawer(){drawer.hidden=true;dSearch.blur();}
(function(){const t=document.getElementById("dToggle"),a=document.getElementById("dActs");
  const set=open=>{t.setAttribute("aria-expanded",open);a.hidden=!open;try{localStorage.setItem("bomba-drawer-open",open?"1":"0")}catch(e){}};
  let open=false;try{open=localStorage.getItem("bomba-drawer-open")==="1"}catch(e){}set(open);t.onclick=()=>set(a.hidden);})();
window.bombaHome=function(){if(window.closeLive)closeLive();closeDrawer();document.getElementById("recents").hidden=true;select(-1);};
dSearch.oninput=drawApps;
document.getElementById("dHandle").onclick=openDrawer;
document.getElementById("dClose").onclick=closeDrawer;
document.getElementById("dWall").onclick=()=>{closeDrawer();BombaNative.pickWallpaper();};
document.getElementById("dHome").onclick=()=>{closeDrawer();BombaNative.homeSettings();};

let dY=0;drawer.addEventListener("touchstart",e=>{dY=e.touches[0].clientY},{passive:true});
drawer.addEventListener("touchend",e=>{if(dGrid.scrollTop<=0&&e.changedTouches[0].clientY-dY>110)closeDrawer();},{passive:true});
if(!window.BombaNative)document.getElementById("dHandle").hidden=true;

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const clock=new THREE.Clock();let sy=0,sp2=0,t=0;
(function loop(){
  const dt=Math.min(clock.getDelta(),.05);t+=dt;
  if(!drag){vy*=.94;vp*=.9;yaw+=vy;pitch=THREE.MathUtils.clamp(pitch+vp,-.9,1.1);}
  sy+=(gx-sy)*.08;sp2+=(gy-sp2)*.08;
  if(focus!==null)rig.rotation.y+=(focus-rig.rotation.y)*.08;
  if(!reduce)APPS.forEach(a=>{const k=APPS.indexOf(a)===sel;const s=THREE.MathUtils.lerp(a.group.position.length()/a.base.length(),k?1.18:1,.1);a.group.position.copy(a.base).multiplyScalar(s);a.group.scale.setScalar(THREE.MathUtils.lerp(a.group.scale.x,k?1.25:1,.1));});
  const Y=yaw+sy,Pt=pitch+sp2;
  cam.position.set(Math.sin(Y)*Math.cos(Pt)*dist,Math.sin(Pt)*dist,Math.cos(Y)*Math.cos(Pt)*dist);cam.lookAt(0,0,0);
  R.render(S,cam);requestAnimationFrame(loop);
})();
})();
</script>
