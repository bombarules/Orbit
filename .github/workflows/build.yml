name: Build Orbit APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # the Android project lives in this folder, not at the top of the repo
        working-directory: Orbit-solar-system/Orbit
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-debug-apk
          path: Orbit-solar-system/Orbit/app/build/outputs/apk/debug/app-debug.apk
